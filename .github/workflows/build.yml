name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python==4.11.0.86 numpy Pillow mss pynput requests pyinstaller customtkinter

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole `
            --name AutoFillFace `
            --icon AutoFillFace.ico `
            --add-data "assets/models;assets/models" `
            --add-data "faceid;faceid" `
            --collect-data customtkinter `
            app/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFillFace-windows
          path: dist/AutoFillFace.exe

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoFillFace.exe
          name: ${{ github.ref_name }}
